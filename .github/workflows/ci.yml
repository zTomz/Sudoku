name: Check and build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter gen-l10n
      - run: git diff --exit-code -- lib/l10n/generated
      - run: dart format --output=none --set-exit-if-changed lib test .github/prepare_web.dart
      - run: dart analyze --fatal-infos
      - run: dart analyze --fatal-infos .github/prepare_web.dart
      - run: flutter test
      - run: flutter build web --release --no-web-resources-cdn
      - run: dart run .github/prepare_web.dart
      - run: node --test test/web_cache_test.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: sudoku-web
          path: build/web
          include-hidden-files: true
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: sudoku-windows
          path: build/windows/x64/runner/Release
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: sudoku-android-unsigned
          path: build/app/outputs/bundle/release/*.aab
