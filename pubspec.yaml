name: sudoku
description: A quiet, offline Sudoku app built with Flutter and Rudi UI.
publish_to: 'none'
version: 0.3.0+4

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  cue: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  go_router: ^18.0.1
  riverpod_annotation: ^4.0.6
  web: ^1.1.1
  intl: any
  reel_text: ^0.5.0
  rudi_ui:
    git:
      url: https://github.com/zTomz/rudi_ui.git
      ref: bd5515ff95321ff8eeaa64f6bbe08df255dd2d97
  shared_preferences: ^2.5.5
  solar_icons: ^0.1.0
  url_launcher: ^6.3.2
  package_info_plus: ^10.2.1

dev_dependencies:
  build_runner: ^2.16.0
  icons_launcher: ^3.1.0
  integration_test:
    sdk: flutter
  riverpod_generator: ^4.0.8
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

icons_launcher:
  image_path: "assets/app_icon_desktop.png"

  platforms:
    web:
      enable: true
      image_path: "assets/app_icon_desktop.png"
      maskable_image_path: "assets/app_icon_desktop.png"
      favicon_path: "assets/app_icon_desktop.png"

    windows:
      enable: true
      image_path: "assets/app_icon_desktop.png"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - LICENSE
    - assets/statistics_empty.png
    - assets/fonts/OFL.txt
    - assets/licenses/solar-icons.txt
  fonts:
    - family: GoogleSans
      fonts:
        - asset: assets/fonts/GoogleSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/GoogleSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/GoogleSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/GoogleSans-Bold.ttf
          weight: 700
