name: sudoku
description: A quiet, offline Sudoku app built with Flutter and Rudi UI.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  cue: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  riverpod_annotation: ^4.0.6
  web: ^1.1.1
  intl: any
  rudi_ui:
    git:
      url: https://github.com/zTomz/rudi_ui.git
      ref: eff9e33e4797e8bbee9c24395b00757ca1e48380
  shared_preferences: ^2.5.5
  solar_icons: ^0.1.0

dev_dependencies:
  build_runner: ^2.16.0
  riverpod_generator: ^4.0.8
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  assets:
    - assets/fonts/OFL.txt
    - assets/licenses/solar-icons.txt
  fonts:
    - family: GoogleSans
      fonts:
        - asset: assets/fonts/GoogleSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/GoogleSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/GoogleSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/GoogleSans-Bold.ttf
          weight: 700
